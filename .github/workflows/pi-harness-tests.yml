name: Pi Harness offline validation
on:
  push:
    branches: [feat/pi-long-running-isolated-eval]
  pull_request:
    paths:
      - 'pi-harness/**'
      - '.github/workflows/pi-harness-tests.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax check
        working-directory: pi-harness
        run: |
          for f in src/*.mjs tests/*.mjs; do node --check "$f"; done
      - name: Offline deterministic unit and workflow tests
        working-directory: pi-harness
        run: npm test
